{% extends 'base.html' %}{% load static %}{% block content %}<section class="dashboard-content" data-ticket-id="{{ ticket_id }}"><div class="detail-toolbar"><a class="button is-light" href="{% url 'tickets' %}">← Tickets</a><h1 class="title is-4">Ticket {{ ticket_id }}</h1></div><div class="box"><p id="detail-status" role="status">Loading…</p><dl id="detail-fields"></dl><h2 class="title is-5">Update ticket</h2><form id="update-ticket" hidden>{% csrf_token %}<div class="ticket-form-grid"><label>Status<select class="input" name="status"><option value="OPEN">Open</option><option value="IN_PROGRESS">In progress</option><option value="RESOLVED">Resolved</option><option value="CANCELLED">Cancelled</option></select></label><label>Priority<select class="input" name="priority"><option value="LOW">Low</option><option value="NORMAL">Normal</option><option value="HIGH">High</option><option value="CRITICAL">Critical</option></select></label><label>Change note<input class="input" name="change_note" maxlength="2000" placeholder="Required when reopening"></label><label>Closing note<input class="input" name="resolution_note" maxlength="2000" placeholder="When resolving or cancelling"></label></div><p id="update-error" class="help is-danger" role="alert"></p><button class="button is-link" type="submit">Save changes</button></form><h2 class="title is-5">Attachments</h2><div id="detail-images"></div><h2 class="title is-5">History</h2><div id="detail-events"></div></div></section><script src="{% static 'js/ticket_detail.js' %}" defer></script>{% endblock %}
