<dialog id="ticket-tag-dialog" class="ticket-dialog" aria-labelledby="ticket-tag-title">
  <form id="ticket-tag-form">
    <header><h2 id="ticket-tag-title" class="title is-4">Edit ticket tags</h2><button class="delete" type="button" id="ticket-tag-close" aria-label="Close"></button></header>
    <div class="ticket-dialog-body"><p class="ticket-help">Choose any tags that apply. Leave them all unchecked for a ticket with no tags.</p>
      <fieldset><legend>Tags</legend><div id="ticket-tag-choices" class="ticket-tag-choices"></div></fieldset>
      <button class="button is-small is-light" id="ticket-tag-clear" type="button">Clear all tags</button>
      <p id="ticket-tag-error" class="help is-danger" role="alert"></p>
    </div><footer><button class="button" type="button" id="ticket-tag-cancel">Cancel</button><button class="button is-link" type="submit">Save tags</button></footer>
  </form>
</dialog>
