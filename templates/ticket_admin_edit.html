<dialog id="admin-edit-dialog" class="ticket-dialog" aria-labelledby="admin-edit-title">
  <form id="admin-edit-form">
    <header><h2 class="title is-4" id="admin-edit-title">Edit ticket details</h2><button class="delete" type="button" id="close-admin-edit" aria-label="Close"></button></header>
    <div class="ticket-dialog-body"><p class="ticket-help">Changes are recorded in the ticket history. Status, priority, staff and attachments can be changed from the ticket controls.</p>
      <div class="ticket-form-grid">
        <label>Reporter name<input class="input" name="reporter_name" maxlength="200" required></label>
        <label>Contact email<input class="input" name="reporter_identifier" type="email" maxlength="254" required></label>
        <label>Equipment<select class="input" name="microscope" id="admin-edit-equipment"></select></label>
        <label>Ticket type<select class="input" name="ticket_type" id="admin-edit-type"><option value="USER_REQUEST">User issue</option><option value="INTERNAL_ISSUE">Technical issue</option></select></label>
      </div>
      <label>Original report<textarea class="textarea" name="message" maxlength="20000" required></textarea></label>
      <label>Closing note<textarea class="textarea" name="resolution_note" maxlength="2000"></textarea><small>Only available for resolved or cancelled tickets.</small></label>
      <p id="admin-edit-error" class="help is-danger" role="alert"></p>
    </div><footer><button class="button" id="cancel-admin-edit" type="button">Cancel</button><button class="button is-link" type="submit">Save details</button></footer>
  </form>
</dialog>
