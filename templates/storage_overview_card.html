<a class="summary-card summary-card-active dashboard-card-link" href="{% url 'storage' %}"{% if user.role == 'researcher' %} aria-label="My storage: OMERO Storage details"{% endif %}>
  <div class="card-heading"><span class="card-icon storage-icon" aria-hidden="true">▣</span></div>
  <div><p class="eyebrow">Managed repository</p><h2 class="title is-4">OMERO Storage</h2></div>
  <div class="summary-metrics">
    <div><span>Filesets</span><span class="summary-value"><strong id="overview-omero-filesets">—</strong><small id="overview-omero-filesets-change">—</small></span></div>
    <div><span>Total storage</span><span class="summary-value"><strong id="overview-omero-storage">—</strong><small id="overview-omero-storage-change">—</small></span></div>
    {% if user.role != 'researcher' %}<div><span>Billable</span><span class="summary-value"><strong id="overview-omero-billable">—</strong><small id="overview-omero-billable-change">—</small></span></div>{% endif %}
  </div>
  <p class="small-note" id="overview-omero-status" role="status"></p>
  <div class="card-link"><span>Details</span><span aria-hidden="true">→</span></div>
</a>
