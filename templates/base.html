<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCI Dashboard</title>
<style>body{font-family:system-ui,sans-serif;color:#1f2937;max-width:1100px;margin:auto;padding:2rem}nav{display:flex;gap:1.5rem;align-items:center;border-bottom:1px solid #ddd;padding-bottom:1rem}a{color:#174f83}button{cursor:pointer;padding:.5rem}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:.6rem;text-align:left;vertical-align:top}form{margin:.5rem 0}select{padding:.35rem}small{color:#555}</style></head>
<body><nav><a href="/">CCI Dashboard</a>{% if user.is_authenticated and user.role == 'admin' %}<a href="{% url 'administration' %}">Administration</a>{% endif %}{% if user.is_authenticated %}<form method="post" action="{% url 'account_logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>{% endif %}</nav><main>{% block content %}{% endblock %}</main></body></html>
