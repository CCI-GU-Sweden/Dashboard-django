{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCI Data Dashboard</title>
<script src="{% static 'js/theme.js' %}"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"><link rel="stylesheet" href="{% static 'css/styles.css' %}"><link rel="icon" href="{% static 'assets/favicon.ico' %}">
<style>.dashboard-actions{display:flex;align-items:center;gap:1rem}.dashboard-actions form{margin:0}.dashboard-content{max-width:1180px;margin:auto;padding:2rem}table{width:100%;border-collapse:collapse}td,th{padding:.7rem;border-bottom:1px solid #dfe7ef;text-align:left}select{padding:.35rem}.disabled-card{opacity:.7}.dashboard-card-link{color:inherit;display:flex;text-decoration:none}.dashboard-card-link:hover{color:inherit}.small-note{color:#64748b;font-size:.9rem}</style>
{% block head %}{% endblock %}</head><body><header class="dashboard-header"><a class="brand-button" href="{% url 'home' %}"><img src="{% static 'assets/GU_logo.webp' %}" alt="University of Gothenburg logo"><span><strong>Centre for Cellular Imaging | Data dashboard</strong></span></a><nav class="dashboard-actions" aria-label="Account"><button class="button is-light theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode">☾ Dark mode</button>{% if user.is_authenticated %}{% if user.role == 'admin' %}<a href="{% url 'administration' %}">Administration</a>{% endif %}<form method="post" action="{% url 'account_logout' %}">{% csrf_token %}<button class="button is-light" type="submit">Sign out</button></form>{% endif %}</nav></header><main>{% block main %}{% block content %}{% endblock %}{% endblock %}</main></body></html>
