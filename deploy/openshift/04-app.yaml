apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: dashboard-django
    spec:
      # Once the HPA is enabled, do not repeatedly overwrite its replica count.
      replicas: 1
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      selector:
        matchLabels:
          app: dashboard-django
      template:
        metadata:
          labels:
            app: dashboard-django
        spec:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 45
          containers:
            - name: web
              # Same immutable image digest used by the successful migration Job.
              image: REPLACE_WITH_BUILT_IMAGE_DIGEST
              imagePullPolicy: IfNotPresent
              ports:
                - name: http
                  containerPort: 8000
                  protocol: TCP
              envFrom:
                - configMapRef:
                    name: dashboard-django-config
                - secretRef:
                    name: dashboard-django-app
              # Reuse the database keys referenced by the current dashboard.
              env:
                # Explicit values override the sandbox values in envFrom. Do
                # not remove these on a database containing production users.
                - name: ORCID_ENVIRONMENT
                  value: production
                - name: ORCID_CLIENT_ID
                  valueFrom:
                    secretKeyRef: {name: dashboard-app, key: ORCID_CLIENT_ID}
                - name: ORCID_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef: {name: dashboard-app, key: ORCID_CLIENT_SECRET}
                - name: DJANGO_ALLOWED_HOSTS
                  value: dashboard-probe.local,dashboard-django-test.apps.k8s.gu.se,dashboard-test-core-omero-test.apps.k8s.gu.se
                - name: DJANGO_CSRF_TRUSTED_ORIGINS
                  value: https://dashboard-django-test.apps.k8s.gu.se,https://dashboard-test-core-omero-test.apps.k8s.gu.se
                - name: PGHOST
                  valueFrom:
                    secretKeyRef: {name: filestatistics-app-credentials, key: PGHOST}
                - name: PGPORT
                  valueFrom:
                    secretKeyRef: {name: filestatistics-app-credentials, key: PGPORT}
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef: {name: filestatistics-app-credentials, key: PGDATABASE}
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: {name: filestatistics-app-credentials, key: PGUSER_DASHBOARD}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: filestatistics-app-credentials, key: PGPASSWORD_DASHBOARD}
              startupProbe:
                httpGet:
                  path: /health/live/
                  port: http
                  httpHeaders:
                    - name: Host
                      value: dashboard-probe.local
                periodSeconds: 5
                failureThreshold: 24
              readinessProbe:
                httpGet:
                  path: /health/ready/
                  port: http
                  httpHeaders:
                    - name: Host
                      value: dashboard-probe.local
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /health/live/
                  port: http
                  httpHeaders:
                    - name: Host
                      value: dashboard-probe.local
                periodSeconds: 20
                timeoutSeconds: 3
                failureThreshold: 3
              resources:
                requests:
                  cpu: 100m
                  memory: 192Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
  # The public route is managed separately by 07-route.yaml and points to the
  # existing maintenance gateway, not directly to this Service.
  - apiVersion: v1
    kind: Service
    metadata:
      name: dashboard-django
    spec:
      selector:
        app: dashboard-django
      ports:
        - name: http
          port: 80
          targetPort: http
