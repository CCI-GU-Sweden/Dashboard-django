# Non-destructive application smoke test. Replace the image digest and use a
# unique Job name for each run. Creates and removes one temporary test session.
apiVersion: batch/v1
kind: Job
metadata:
  name: dashboard-django-smoke-REPLACE_WITH_RELEASE
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: smoke
          image: REPLACE_WITH_BUILT_IMAGE_DIGEST
          command: ["python", "-c"]
          args:
            - |
              import os
              os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'dashboard.settings')
              import django
              django.setup()
              from django.test import Client
              from accounts.models import User
              user = User.objects.filter(role=User.Role.ADMIN, is_active=True).first()
              if not user:
                  raise RuntimeError('No active administrator is available for smoke testing.')
              client = Client(HTTP_HOST='dashboard-django-test.apps.k8s.gu.se')
              client.force_login(user)
              try:
                  for path in ['/', '/uploads/', '/storage/', '/administration/', '/tickets/', '/storage/billing/', '/api/uploads/summary', '/api/uploads/summary?metric=total_file_size_mb&period=30', '/api/uploads/scopes', '/api/omero/filesets', '/api/omero/groups', '/api/omero/history', '/api/omero/overview', '/api/omero/overview-card', '/api/omero/admin/policies', '/api/omero/admin/health', '/api/tickets', '/api/tickets/summary', '/api/tickets/equipment', '/api/omero/billing?startDate=2026-01-01&endDate=2026-02-01']:
                      response = client.get(path, secure=True)
                      print(path, response.status_code, flush=True)
                      if response.status_code != 200:
                          raise RuntimeError('Smoke test failed.')
                      if path.startswith('/api/uploads/summary') and 'chart_data' not in response.json():
                          raise RuntimeError('Upload chart data is missing.')
                  import json, uuid
                  from django.db import connection, transaction
                  with connection.cursor() as cursor:
                      cursor.execute('SELECT fileset_id FROM public.omero_fileset ORDER BY fileset_id LIMIT 1')
                      sample_fileset = cursor.fetchone()
                      cursor.execute('''SELECT s.group_id FROM public.group_storage_snapshot s
                          JOIN public.storage_policy p ON p.group_id = s.group_id AND p.valid_from <= s.snapshot_date
                          AND (p.valid_until IS NULL OR p.valid_until >= s.snapshot_date)
                          ORDER BY s.snapshot_date DESC LIMIT 1''')
                      email_group = cursor.fetchone()
                  if sample_fileset:
                      response = client.get('/api/omero/filesets/' + str(sample_fileset[0]), secure=True)
                      print('fileset details:', response.status_code, flush=True)
                      if response.status_code != 200 or not isinstance(response.json()['source_file_names'], list) or not isinstance(response.json()['locations'], list):
                          raise RuntimeError('Fileset details smoke test failed.')
                  if email_group:
                      response = client.get('/api/omero/groups/' + str(email_group[0]) + '/email-draft', secure=True)
                      print('email draft:', response.status_code, flush=True)
                      if response.status_code != 200 or not isinstance(response.json()['recipients'], list):
                          raise RuntimeError('Email draft smoke test failed.')
                  with transaction.atomic():
                      payload = {'reporter_name': 'Rollback smoke test', 'reporter_identifier': 'test@example.org', 'microscope': '', 'message': 'Temporary rollback test', 'ticket_type': 'USER_REQUEST', 'issue_type': '', 'priority': 'NORMAL', 'source_event_id': str(uuid.uuid4())}
                      with connection.cursor() as cursor:
                          cursor.execute('SELECT equipment_id FROM public.ticket_equipment WHERE active = true ORDER BY equipment_id LIMIT 1')
                          equipment = cursor.fetchone()
                      if equipment:
                          payload['microscope'] = equipment[0]
                      response = client.post('/api/tickets', data=json.dumps(payload), content_type='application/json', secure=True)
                      print('ticket creation:', response.status_code, flush=True)
                      if response.status_code != 201:
                          raise RuntimeError('Ticket creation smoke test failed.')
                      retry = client.post('/api/tickets', data=json.dumps(payload), content_type='application/json', secure=True)
                      print('ticket retry:', retry.status_code, flush=True)
                      if retry.status_code != 200 or retry.json()['ticket_id'] != response.json()['ticket_id']:
                          raise RuntimeError('Ticket retry smoke test failed.')
                      payload['message'] = 'Changed request'
                      conflict = client.post('/api/tickets', data=json.dumps(payload), content_type='application/json', secure=True)
                      print('ticket retry conflict:', conflict.status_code, flush=True)
                      if conflict.status_code != 409:
                          raise RuntimeError('Ticket conflict smoke test failed.')
                      ticket_id = response.json()['ticket_id']
                      changes = {'version': 1, 'status': 'IN_PROGRESS', 'priority': 'HIGH', 'change_note': 'Smoke test'}
                      updated = client.patch('/api/tickets/' + ticket_id, data=json.dumps(changes), content_type='application/json', secure=True)
                      print('ticket update:', updated.status_code, flush=True)
                      if updated.status_code != 200 or updated.json()['version'] != 2:
                          raise RuntimeError('Ticket update smoke test failed.')
                      stale = client.patch('/api/tickets/' + ticket_id, data=json.dumps(changes), content_type='application/json', secure=True)
                      print('stale ticket update:', stale.status_code, flush=True)
                      if stale.status_code != 409:
                          raise RuntimeError('Stale ticket update smoke test failed.')
                      from datetime import date, timedelta
                      with connection.cursor() as cursor:
                          cursor.execute('SELECT group_id FROM public.storage_policy ORDER BY group_id LIMIT 1')
                          policy_group = cursor.fetchone()
                          if policy_group:
                              cursor.execute('SELECT MAX(valid_from) FROM public.storage_policy WHERE group_id = %s', [policy_group[0]])
                              latest = cursor.fetchone()[0]
                              effective = max(date.today(), latest) + timedelta(days=400)
                              policy = {'group_id': str(policy_group[0]), 'policy_type': 'CORE', 'valid_from': effective.isoformat(), 'billing_grace_days': '0', 'notes': 'Rollback smoke test'}
                              result = client.post('/api/omero/policies', data=json.dumps(policy), content_type='application/json', secure=True)
                              print('policy creation:', result.status_code, flush=True)
                              if result.status_code != 201:
                                  raise RuntimeError('Policy creation smoke test failed.')
                      from accounts.models import VerifiedOmeroGroup
                      researcher = User.objects.create_user(username='smoke-' + uuid.uuid4().hex, role=User.Role.RESEARCHER)
                      VerifiedOmeroGroup.objects.create(user=researcher, group_id=9223372036854775806, valid_until=date.today() + timedelta(days=1), verified_by=user)
                      admin_page = client.get('/administration/', secure=True)
                      if admin_page.status_code != 200 or b'class="group-select"' not in admin_page.content:
                          raise RuntimeError('Researcher group selector is missing.')
                      scoped = Client(HTTP_HOST='dashboard-django-test.apps.k8s.gu.se')
                      scoped.force_login(researcher)
                      card = scoped.get('/api/omero/overview-card?group_id=1', secure=True)
                      if card.status_code != 200 or card.json()['snapshot_date'] is not None or 'daily_sek' in card.json()['metrics']:
                          raise RuntimeError('Researcher overview is not correctly scoped.')
                      if email_group:
                          VerifiedOmeroGroup.objects.filter(user=researcher).update(group_id=email_group[0])
                          card = scoped.get('/api/omero/overview-card', secure=True)
                          if card.status_code != 200 or card.json()['snapshot_date'] is None or 'daily_sek' in card.json()['metrics']:
                              raise RuntimeError('Researcher group overview failed.')
                          VerifiedOmeroGroup.objects.filter(user=researcher).update(group_id=9223372036854775806)
                      for path in ['/api/omero/filesets?group_id=1', '/api/omero/history?group_id=1', '/api/omero/groups']:
                          response = scoped.get(path, secure=True)
                          print('researcher scoped:', path, response.status_code, flush=True)
                          if response.status_code != 200:
                              raise RuntimeError('Researcher scope smoke test failed.')
                          key = 'results' if 'filesets' in path else ('history' if 'history' in path else 'groups')
                          if response.json()[key]:
                              raise RuntimeError('Researcher received data outside the test group.')
                      if scoped.get('/api/omero/admin/policies', secure=True).status_code != 403:
                          raise RuntimeError('Researcher accessed admin policy data.')
                      transaction.set_rollback(True)
              finally:
                  client.logout()
          envFrom:
            - configMapRef:
                name: dashboard-django-config
            - secretRef:
                name: dashboard-django-app
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef: {name: filestatistics-app-credentials, key: PGHOST}
            - name: PGPORT
              valueFrom:
                secretKeyRef: {name: filestatistics-app-credentials, key: PGPORT}
            - name: PGDATABASE
              valueFrom:
                secretKeyRef: {name: filestatistics-app-credentials, key: PGDATABASE}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: filestatistics-app-credentials, key: PGUSER_DASHBOARD}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: filestatistics-app-credentials, key: PGPASSWORD_DASHBOARD}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
