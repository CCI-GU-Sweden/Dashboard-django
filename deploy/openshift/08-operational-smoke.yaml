# Non-destructive application smoke test. Replace the image digest and use a
# unique Job name for each run. Creates and removes one temporary test session.
apiVersion: batch/v1
kind: Job
metadata:
  name: dashboard-django-smoke-REPLACE_WITH_RELEASE
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: smoke
          image: REPLACE_WITH_BUILT_IMAGE_DIGEST
          command: ["python", "-c"]
          args:
            - |
              import os
              os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'dashboard.settings')
              import django
              django.setup()
              from django.test import Client
              from accounts.models import User
              user = User.objects.filter(role=User.Role.ADMIN, is_active=True).first()
              if not user:
                  raise RuntimeError('No active administrator is available for smoke testing.')
              client = Client(HTTP_HOST='dashboard-django-test.apps.k8s.gu.se')
              client.force_login(user)
              try:
                  for path in ['/', '/uploads/', '/storage/', '/administration/', '/tickets/', '/storage/billing/', '/api/uploads/summary', '/api/uploads/summary?metric=total_file_size_mb&period=30', '/api/uploads/scopes', '/api/omero/filesets', '/api/omero/groups', '/api/omero/history', '/api/omero/overview', '/api/omero/overview-card', '/api/omero/admin/policies', '/api/omero/admin/health', '/api/tickets', '/api/tickets/summary', '/api/tickets/equipment', '/api/tickets/staff', '/api/tickets/researchers', '/api/omero/billing?startDate=2026-01-01&endDate=2026-02-01']:
                      response = client.get(path, secure=True)
                      print(path, response.status_code, flush=True)
                      if response.status_code != 200:
                          raise RuntimeError('Smoke test failed.')
                      if path.startswith('/api/uploads/summary') and 'chart_data' not in response.json():
                          raise RuntimeError('Upload chart data is missing.')
                  import json, uuid
                  from django.db import connection, transaction
                  def browser_multipart(fields):
                      parts = []
                      for name, value in fields.items():
                          parts.append(('--browser-boundary\r\nContent-Disposition: form-data; name="' + name + '"\r\n\r\n' + str(value) + '\r\n').encode())
                      parts.append(b'--browser-boundary\r\nContent-Disposition: form-data; name="images"; filename=""\r\nContent-Type: application/octet-stream\r\n\r\n\r\n')
                      parts.append(b'--browser-boundary--\r\n')
                      return b''.join(parts)
                  multipart_type = 'multipart/form-data; boundary=browser-boundary'
                  with connection.cursor() as cursor:
                      cursor.execute('SELECT fileset_id FROM public.omero_fileset ORDER BY fileset_id LIMIT 1')
                      sample_fileset = cursor.fetchone()
                      cursor.execute('''SELECT s.group_id FROM public.group_storage_snapshot s
                          JOIN public.storage_policy p ON p.group_id = s.group_id AND p.valid_from <= s.snapshot_date
                          AND (p.valid_until IS NULL OR p.valid_until >= s.snapshot_date)
                          ORDER BY s.snapshot_date DESC LIMIT 1''')
                      email_group = cursor.fetchone()
                  if sample_fileset:
                      response = client.get('/api/omero/filesets/' + str(sample_fileset[0]), secure=True)
                      print('fileset details:', response.status_code, flush=True)
                      if response.status_code != 200 or not isinstance(response.json()['source_file_names'], list) or not isinstance(response.json()['locations'], list):
                          raise RuntimeError('Fileset details smoke test failed.')
                  if email_group:
                      response = client.get('/api/omero/groups/' + str(email_group[0]) + '/email-draft', secure=True)
                      print('email draft:', response.status_code, flush=True)
                      if response.status_code != 200 or not isinstance(response.json()['recipients'], list):
                          raise RuntimeError('Email draft smoke test failed.')
                  with transaction.atomic():
                      equipment_name = 'Rollback equipment ' + uuid.uuid4().hex
                      created_equipment = client.post('/api/tickets/equipment/manage', data=json.dumps({'name': equipment_name, 'category': 'Microscope'}), content_type='application/json', secure=True)
                      print('equipment creation:', created_equipment.status_code, flush=True)
                      if created_equipment.status_code != 201:
                          raise RuntimeError('Equipment creation failed.')
                      new_equipment = created_equipment.json()
                      ticket_payload = {'reporter_name': 'Rollback smoke test', 'reporter_identifier': 'test@example.org', 'microscope': new_equipment['id'], 'message': 'Temporary equipment test', 'ticket_type': 'USER_REQUEST', 'issue_type': '', 'priority': 'NORMAL', 'source_event_id': str(uuid.uuid4())}
                      equipment_ticket = client.post('/api/tickets', data=json.dumps(ticket_payload), content_type='application/json', secure=True)
                      if equipment_ticket.status_code != 201:
                          raise RuntimeError('Ticket with new equipment failed.')
                      expected = {'name': new_equipment['name'], 'category': new_equipment['category'], 'active': True}
                      equipment_update = {'name': equipment_name, 'category': 'Microscope', 'active': False, 'expected': expected}
                      equipment_url = '/api/tickets/equipment/manage/' + new_equipment['id']
                      edited_equipment = client.patch(equipment_url, data=json.dumps(equipment_update), content_type='application/json', secure=True)
                      print('equipment deactivation:', edited_equipment.status_code, flush=True)
                      if edited_equipment.status_code != 200 or edited_equipment.json()['active']:
                          raise RuntimeError('Equipment deactivation failed.')
                      if client.patch(equipment_url, data=json.dumps(equipment_update), content_type='application/json', secure=True).status_code != 409:
                          raise RuntimeError('Stale equipment update was not rejected.')
                      saved_ticket = client.get('/api/tickets/' + equipment_ticket.json()['ticket_id'], secure=True)
                      if saved_ticket.status_code != 200 or saved_ticket.json()['microscope'] != new_equipment['id']:
                          raise RuntimeError('Equipment deactivation broke an existing ticket.')
                      ticket_payload['source_event_id'] = str(uuid.uuid4())
                      if client.post('/api/tickets', data=json.dumps(ticket_payload), content_type='application/json', secure=True).status_code != 400:
                          raise RuntimeError('Inactive equipment was allowed on a new ticket.')
                      payload = {'reporter_name': 'Rollback smoke test', 'reporter_identifier': 'test@example.org', 'microscope': '', 'message': 'Temporary rollback test', 'ticket_type': 'USER_REQUEST', 'issue_type': '', 'priority': 'NORMAL', 'source_event_id': str(uuid.uuid4())}
                      with connection.cursor() as cursor:
                          cursor.execute('SELECT equipment_id FROM public.ticket_equipment WHERE active = true ORDER BY equipment_id LIMIT 1')
                          equipment = cursor.fetchone()
                      if equipment:
                          payload['microscope'] = equipment[0]
                      response = client.post('/api/tickets', data=json.dumps(payload), content_type='application/json', secure=True)
                      print('ticket creation:', response.status_code, flush=True)
                      if response.status_code != 201:
                          raise RuntimeError('Ticket creation smoke test failed.')
                      retry = client.post('/api/tickets', data=json.dumps(payload), content_type='application/json', secure=True)
                      print('ticket retry:', retry.status_code, flush=True)
                      if retry.status_code != 200 or retry.json()['ticket_id'] != response.json()['ticket_id']:
                          raise RuntimeError('Ticket retry smoke test failed.')
                      payload['message'] = 'Changed request'
                      conflict = client.post('/api/tickets', data=json.dumps(payload), content_type='application/json', secure=True)
                      print('ticket retry conflict:', conflict.status_code, flush=True)
                      if conflict.status_code != 409:
                          raise RuntimeError('Ticket conflict smoke test failed.')
                      ticket_id = response.json()['ticket_id']
                      changes = {'version': 1, 'status': 'IN_PROGRESS', 'priority': 'HIGH', 'change_note': 'Smoke test'}
                      updated = client.patch('/api/tickets/' + ticket_id, data=json.dumps(changes), content_type='application/json', secure=True)
                      print('ticket update:', updated.status_code, flush=True)
                      if updated.status_code != 200 or updated.json()['version'] != 2:
                          raise RuntimeError('Ticket update smoke test failed.')
                      stale = client.patch('/api/tickets/' + ticket_id, data=json.dumps(changes), content_type='application/json', secure=True)
                      print('stale ticket update:', stale.status_code, flush=True)
                      if stale.status_code != 409:
                          raise RuntimeError('Stale ticket update smoke test failed.')
                      browser_payload = dict(payload, source_event_id=str(uuid.uuid4()))
                      browser_ticket = client.generic('POST', '/api/tickets', browser_multipart(browser_payload), content_type=multipart_type, secure=True)
                      print('browser ticket without image:', browser_ticket.status_code, flush=True)
                      if browser_ticket.status_code != 201:
                          raise RuntimeError('Browser-style ticket without image failed.')
                      browser_update = {'version': '1', 'status': 'IN_PROGRESS', 'priority': 'NORMAL', 'change_note': 'Browser update', 'resolution_note': '', 'issue_type': '', 'assigned_to': ''}
                      browser_result = client.generic('POST', '/api/tickets/' + browser_ticket.json()['ticket_id'], browser_multipart(browser_update), content_type=multipart_type, secure=True)
                      if browser_result.status_code != 200:
                          raise RuntimeError('Browser-style ticket update without image failed.')
                      invalid_payload = dict(payload, reporter_identifier='invalid-email', message='')
                      invalid_ticket = client.post('/api/tickets', data=json.dumps(invalid_payload), content_type='application/json', secure=True)
                      if invalid_ticket.status_code != 400 or 'Contact email:' not in invalid_ticket.json()['error'] or 'Message:' not in invalid_ticket.json()['error']:
                          raise RuntimeError('Ticket validation errors were not specific.')
                      from io import BytesIO
                      from PIL import Image
                      from django.core.files.uploadedfile import SimpleUploadedFile
                      image_buffer = BytesIO()
                      Image.new('RGB', (2, 2), 'red').save(image_buffer, format='PNG')
                      image_bytes = image_buffer.getvalue()
                      upload_payload = dict(payload)
                      upload_payload['source_event_id'] = str(uuid.uuid4())
                      upload_payload['images'] = SimpleUploadedFile('smoke.png', image_bytes, content_type='image/png')
                      uploaded = client.post('/api/tickets', data=upload_payload, secure=True)
                      print('ticket with image:', uploaded.status_code, flush=True)
                      if uploaded.status_code != 201:
                          raise RuntimeError('Ticket attachment creation failed.')
                      uploaded_id = uploaded.json()['ticket_id']
                      upload_payload['images'] = SimpleUploadedFile('smoke.png', image_bytes, content_type='image/png')
                      retry_upload = client.post('/api/tickets', data=upload_payload, secure=True)
                      if retry_upload.status_code != 200 or retry_upload.json()['ticket_id'] != uploaded_id:
                          raise RuntimeError('Ticket attachment retry failed.')
                      update_payload = {'version': '1', 'status': 'IN_PROGRESS', 'priority': 'HIGH', 'issue_type': 'SOFTWARE', 'assigned_to': str(user.pk), 'change_note': 'Image smoke update', 'images': SimpleUploadedFile('second.png', image_bytes, content_type='image/png')}
                      upload_update = client.post('/api/tickets/' + uploaded_id, data=update_payload, secure=True)
                      print('ticket image update:', upload_update.status_code, flush=True)
                      if upload_update.status_code != 200 or upload_update.json()['version'] != 2:
                          raise RuntimeError('Ticket image update failed.')
                      ticket_details = client.get('/api/tickets/' + uploaded_id, secure=True)
                      if ticket_details.status_code != 200 or len(ticket_details.json()['images']) != 2 or ticket_details.json()['assigned_to'] != 'dashboard-user:' + str(user.pk):
                          raise RuntimeError('Ticket image details or assignment failed.')
                      image_id = ticket_details.json()['images'][0]['id']
                      if client.get('/api/tickets/' + uploaded_id + '/images/' + image_id, secure=True).content != image_bytes:
                          raise RuntimeError('Ticket image retrieval failed.')
                      from datetime import date, timedelta
                      with connection.cursor() as cursor:
                          cursor.execute('SELECT group_id FROM public.storage_policy ORDER BY group_id LIMIT 1')
                          policy_group = cursor.fetchone()
                          if policy_group:
                              cursor.execute('SELECT MAX(valid_from) FROM public.storage_policy WHERE group_id = %s', [policy_group[0]])
                              latest = cursor.fetchone()[0]
                              effective = max(date.today(), latest) + timedelta(days=400)
                              policy = {'group_id': str(policy_group[0]), 'policy_type': 'CORE', 'valid_from': effective.isoformat(), 'billing_grace_days': '0', 'notes': 'Rollback smoke test'}
                              result = client.post('/api/omero/policies', data=json.dumps(policy), content_type='application/json', secure=True)
                              print('policy creation:', result.status_code, flush=True)
                              if result.status_code != 201:
                                  raise RuntimeError('Policy creation smoke test failed.')
                      from accounts.models import VerifiedOmeroGroup
                      researcher = User.objects.create_user(username='smoke-' + uuid.uuid4().hex, role=User.Role.RESEARCHER)
                      VerifiedOmeroGroup.objects.create(user=researcher, group_id=9223372036854775806, valid_until=date.today() + timedelta(days=1), verified_by=user)
                      admin_page = client.get('/administration/', secure=True)
                      if admin_page.status_code != 200 or b'class="group-select"' not in admin_page.content:
                          raise RuntimeError('Researcher group selector is missing.')
                      scoped = Client(HTTP_HOST='dashboard-django-test.apps.k8s.gu.se')
                      scoped.force_login(researcher)
                      own_summary = scoped.get('/api/tickets/summary', secure=True)
                      if own_summary.status_code != 200 or own_summary.json()['total'] != 0:
                          raise RuntimeError('Unlinked researcher ticket summary leaked data.')
                      if scoped.get('/api/tickets/' + uploaded_id, secure=True).status_code != 404:
                          raise RuntimeError('Unlinked researcher accessed a ticket.')
                      link_body = {'researcher_id': str(researcher.pk), 'expected_researcher_id': None}
                      link_result = client.patch('/api/tickets/' + uploaded_id + '/researcher', data=json.dumps(link_body), content_type='application/json', secure=True)
                      print('researcher ticket link:', link_result.status_code, flush=True)
                      if link_result.status_code != 200:
                          raise RuntimeError('Manual researcher ticket link failed.')
                      linked_detail = scoped.get('/api/tickets/' + uploaded_id, secure=True)
                      linked_summary = scoped.get('/api/tickets/summary', secure=True)
                      if linked_detail.status_code != 200 or 'events' in linked_detail.json() or linked_detail.json()['images'] or linked_summary.json()['total'] != 1:
                          raise RuntimeError('Linked researcher ticket scope failed.')
                      if scoped.get('/api/tickets/' + uploaded_id + '/images/' + image_id, secure=True).status_code != 404:
                          raise RuntimeError('Researcher accessed a staff ticket image.')
                      researcher_payload = {'reporter_name': 'Researcher', 'reporter_identifier': 'r@example.org', 'microscope': '', 'message': 'Temporary researcher ticket', 'ticket_type': 'USER_REQUEST', 'issue_type': '', 'priority': 'NORMAL', 'source_event_id': str(uuid.uuid4())}
                      if scoped.post('/api/tickets', data=json.dumps(researcher_payload), content_type='application/json', secure=True).status_code != 403:
                          raise RuntimeError('Researcher bypassed ticket creation permission.')
                      permission = client.post('/administration/accounts/' + str(researcher.pk) + '/', data={'role': 'researcher', 'active': 'yes', 'can_create_tickets': 'yes'}, secure=True)
                      researcher.refresh_from_db()
                      print('researcher permission save:', permission.status_code, researcher.can_create_tickets, flush=True)
                      if permission.status_code != 302 or not researcher.can_create_tickets:
                          raise RuntimeError('Researcher creation permission did not save.')
                      created_own = scoped.generic('POST', '/api/tickets', browser_multipart(researcher_payload), content_type=multipart_type, secure=True)
                      print('researcher ticket creation:', created_own.status_code, flush=True)
                      if created_own.status_code != 201 or scoped.get('/api/tickets/summary', secure=True).json()['total'] != 2:
                          raise RuntimeError('Researcher self-linked creation failed.')
                      client.post('/administration/accounts/' + str(researcher.pk) + '/', data={'role': 'researcher', 'active': 'yes'}, secure=True)
                      if scoped.post('/api/tickets', data=json.dumps(researcher_payload), content_type='application/json', secure=True).status_code != 403:
                          raise RuntimeError('Revoked researcher creation permission was ignored.')
                      staff_user = User.objects.create_user(username='smoke-staff-' + uuid.uuid4().hex, role=User.Role.STAFF)
                      staff_client = Client(HTTP_HOST='dashboard-django-test.apps.k8s.gu.se')
                      staff_client.force_login(staff_user)
                      staff_payload = dict(researcher_payload, source_event_id=str(uuid.uuid4()))
                      staff_ticket = staff_client.post('/api/tickets', data=json.dumps(staff_payload), content_type='application/json', secure=True)
                      print('staff ticket creation:', staff_ticket.status_code, flush=True)
                      if staff_ticket.status_code != 201:
                          raise RuntimeError('Staff could not create a ticket.')
                      staff_changes = {'version': 1, 'status': 'IN_PROGRESS', 'priority': 'NORMAL', 'change_note': 'Staff smoke update'}
                      staff_update = staff_client.patch('/api/tickets/' + staff_ticket.json()['ticket_id'], data=json.dumps(staff_changes), content_type='application/json', secure=True)
                      if staff_update.status_code != 200:
                          raise RuntimeError('Staff could not update a ticket.')
                      other = User.objects.create_user(username='smoke-other-' + uuid.uuid4().hex, role=User.Role.RESEARCHER)
                      other_client = Client(HTTP_HOST='dashboard-django-test.apps.k8s.gu.se')
                      other_client.force_login(other)
                      if other_client.get('/api/tickets/' + created_own.json()['ticket_id'], secure=True).status_code != 404 or other_client.get('/api/tickets/summary', secure=True).json()['total'] != 0:
                          raise RuntimeError('Another researcher accessed linked tickets.')
                      card = scoped.get('/api/omero/overview-card?group_id=1', secure=True)
                      if card.status_code != 200 or card.json()['snapshot_date'] is not None or 'daily_sek' in card.json()['metrics']:
                          raise RuntimeError('Researcher overview is not correctly scoped.')
                      if email_group:
                          VerifiedOmeroGroup.objects.filter(user=researcher).update(group_id=email_group[0])
                          card = scoped.get('/api/omero/overview-card', secure=True)
                          if card.status_code != 200 or card.json()['snapshot_date'] is None or 'daily_sek' in card.json()['metrics']:
                              raise RuntimeError('Researcher group overview failed.')
                          VerifiedOmeroGroup.objects.filter(user=researcher).update(group_id=9223372036854775806)
                      for path in ['/api/omero/filesets?group_id=1', '/api/omero/history?group_id=1', '/api/omero/groups']:
                          response = scoped.get(path, secure=True)
                          print('researcher scoped:', path, response.status_code, flush=True)
                          if response.status_code != 200:
                              raise RuntimeError('Researcher scope smoke test failed.')
                          key = 'results' if 'filesets' in path else ('history' if 'history' in path else 'groups')
                          if response.json()[key]:
                              raise RuntimeError('Researcher received data outside the test group.')
                      if scoped.get('/api/omero/admin/policies', secure=True).status_code != 403:
                          raise RuntimeError('Researcher accessed admin policy data.')
                      VerifiedOmeroGroup.objects.create(user=researcher, group_id=9223372036854775805, valid_until=date.today() + timedelta(days=1), verified_by=user)
                      billing = scoped.get('/api/omero/billing?startDate=2000-01-01&endDate=2099-01-01', secure=True)
                      if billing.status_code != 200 or billing.json()['groups']:
                          raise RuntimeError('Researcher billing leaked data outside their two verified groups.')
                      staff_changes = {'version': 2, 'status': 'IN_PROGRESS', 'priority': 'NORMAL', 'assigned_staff': json.dumps([str(user.pk), str(staff_user.pk)])}
                      assigned = staff_client.patch('/api/tickets/' + staff_ticket.json()['ticket_id'], data=json.dumps(staff_changes), content_type='application/json', secure=True)
                      detail = staff_client.get('/api/tickets/' + staff_ticket.json()['ticket_id'], secure=True)
                      if assigned.status_code != 200 or detail.status_code != 200 or len(detail.json()['assigned_staff']) != 2:
                          raise RuntimeError('Multiple staff assignment failed.')
                      print('multi-group billing and staff assignment: passed', flush=True)
                      transaction.set_rollback(True)
              finally:
                  client.logout()
          envFrom:
            - configMapRef:
                name: dashboard-django-config
            - secretRef:
                name: dashboard-django-app
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef: {name: filestatistics-app-credentials, key: PGHOST}
            - name: PGPORT
              valueFrom:
                secretKeyRef: {name: filestatistics-app-credentials, key: PGPORT}
            - name: PGDATABASE
              valueFrom:
                secretKeyRef: {name: filestatistics-app-credentials, key: PGDATABASE}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: filestatistics-app-credentials, key: PGUSER_DASHBOARD}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: filestatistics-app-credentials, key: PGPASSWORD_DASHBOARD}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
