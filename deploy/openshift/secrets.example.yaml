# Reference only. Prefer creating these three Opaque Secrets in the OpenShift
# console. Never commit actual secret values to Git or share filled-in YAML.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: dashboard-django-app
    type: Opaque
    stringData:
      DJANGO_SECRET_KEY: REPLACE_WITH_LONG_RANDOM_SECRET
      ORCID_CLIENT_ID: REPLACE_WITH_SANDBOX_CLIENT_ID
      ORCID_CLIENT_SECRET: REPLACE_WITH_SANDBOX_CLIENT_SECRET
  - apiVersion: v1
    kind: Secret
    metadata:
      name: dashboard-django-runtime-db
    type: Opaque
    stringData:
      PGHOST: REPLACE_WITH_DATABASE_HOST
      PGPORT: "5432"
      PGDATABASE: REPLACE_WITH_DATABASE_NAME
      PGUSER: REPLACE_WITH_RUNTIME_USER
      PGPASSWORD: REPLACE_WITH_RUNTIME_PASSWORD
  - apiVersion: v1
    kind: Secret
    metadata:
      name: dashboard-django-migration-db
    type: Opaque
    stringData:
      PGHOST: REPLACE_WITH_DATABASE_HOST
      PGPORT: "5432"
      PGDATABASE: REPLACE_WITH_DATABASE_NAME
      PGUSER: REPLACE_WITH_MIGRATION_USER
      PGPASSWORD: REPLACE_WITH_MIGRATION_PASSWORD
