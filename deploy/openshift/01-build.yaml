apiVersion: v1
kind: List
items:
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: dashboard-django
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: dashboard-django
    spec:
      # The in-cluster poller starts candidates; image promotion remains manual.
      runPolicy: Serial
      source:
        type: Git
        git:
          uri: https://github.com/CCI-GU-Sweden/Dashboard-django.git
          ref: main
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: Dockerfile
      output:
        to:
          kind: ImageStreamTag
          name: dashboard-django:candidate
