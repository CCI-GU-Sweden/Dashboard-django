apiVersion: v1
kind: List
items:
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: dashboard-django
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: dashboard-django
    spec:
      # Start builds manually so a build cannot bypass the migration/release sequence.
      runPolicy: Serial
      source:
        type: Git
        git:
          uri: https://github.com/CCI-GU-Sweden/Dashboard-django.git
          # Replace with the reviewed commit SHA to build; it must exist on GitHub.
          ref: REPLACE_WITH_GIT_COMMIT
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: Dockerfile
      output:
        to:
          kind: ImageStreamTag
          name: dashboard-django:candidate
