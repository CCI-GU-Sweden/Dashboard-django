server {
    listen 3000;
    server_name flask.apps.k8s.gu.se;

    location = /healthz {
    return 200 "ok";
    }

    error_page 503 /maintenance.html;

    location = /style.css {
        root /usr/share/nginx/html;
        }

    location /images/ {
        root /usr/share/nginx/html;
    }

    location / {
        if (-f /etc/nginx/maintenance/flask.flag) {
        return 503;
    }

    client_max_body_size 100G;

        proxy_pass http://flask-app:5000;
    }

    location = /maintenance.html {
    root /usr/share/nginx/html;
    internal;}
}

server {
    listen 3000;
    server_name dashboard-omero.apps.k8s.gu.se;

    location = /healthz {
    return 200 "ok";
    }

    error_page 503 /maintenance.html;

    location = /style.css {
        root /usr/share/nginx/html;
    }

    location /images/ {
        root /usr/share/nginx/html;
    }

    location / {
    if (-f /etc/nginx/maintenance/dashboard.flag) {
        return 503;
    }

    client_max_body_size 2G;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dashboard-django:80;
    }

    location = /maintenance.html {
    root /usr/share/nginx/html;
    internal;}
}

server {
    listen 3000;
    server_name omero-cci-users.gu.se;

    location = /healthz {
        return 200 "ok";
    }

    error_page 503 /maintenance.html;

    location = /style.css {
        root /usr/share/nginx/html;
    }

    location /images/ {
        root /usr/share/nginx/html;
    }

    location / {
        if (-f /etc/nginx/maintenance/omero.flag) {
            return 503;
        }

    client_max_body_size 100G;

        proxy_pass http://omero-web:4080;
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
