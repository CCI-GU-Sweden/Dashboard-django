apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-django-config
data:
  DJANGO_DEBUG: "0"
  # The probe name is used only in internal health-check Host headers.
  DJANGO_ALLOWED_HOSTS: dashboard-probe.local,dashboard-test-core-omero-test.apps.k8s.gu.se
  DJANGO_CSRF_TRUSTED_ORIGINS: https://dashboard-test-core-omero-test.apps.k8s.gu.se
  # This test Route uses edge TLS and replaces forwarded headers. Re-verify
  # trusted proxy behavior and backend reachability for any other deployment.
  DJANGO_TRUST_PROXY_HTTPS: "1"
  # Sandbox values are retained for the one-off isolation Job. The running web
  # deployment explicitly overrides this to production and uses dashboard-app.
  ORCID_ENVIRONMENT: sandbox
